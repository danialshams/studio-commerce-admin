services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daira_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/003_integrations.sql:/docker-entrypoint-initdb.d/02-integrations.sql:ro
      - ./database/004_demo_data.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d daira_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/daira_crm
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    depends_on:
      db: { condition: service_healthy }
volumes: { postgres_data: {} }
