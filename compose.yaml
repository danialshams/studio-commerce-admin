services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studio_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U postgres']
      interval: 5s
      retries: 10
volumes:
  studio_pg:
