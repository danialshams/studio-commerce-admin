name: Next.js commerce admin CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_admin?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma db push --skip-generate
      - run: npx prisma generate
      - run: npm run test
      - run: npm run typecheck
      - name: Real desktop, tablet and mobile modal browser regression
        env:
          NEXT_PUBLIC_STUDIO_DEMO: "1"
        run: node scripts/test-modal-browser.mjs
      - name: Upload Chromium screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-modal-order-screenshots
          path: .artifacts/dialogs/*.png
          if-no-files-found: ignore
      - run: npm run build
